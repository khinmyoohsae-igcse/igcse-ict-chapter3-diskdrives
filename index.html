                question: "Which of the following scenarios is the best use case for a portable hard disk drive rather than a cloud storage service or optical disc?",
                options: [
                    { text: "Backing up a local computer system containing 2 terabytes of personal files quickly without needing an internet connection", isCorrect: true, rationale: "Portable HDDs allow rapid local backups of massive files without relying on slow internet broadband speeds." },
                    { text: "Listening to a single audio track on a smartphone while jogging", isCorrect: false, rationale: "Jogging requires small flash memory or streaming." },
                    { text: "Reading a 5-page PDF document on a public library computer", isCorrect: false, rationale: "Small files can be emailed or downloaded from cloud storage." },
                    { text: "Scanning grocery items at a supermarket checkout", isCorrect: false, rationale: "This requires a barcode reader." }
                ]
            },
            {
                question: "Which summary best encapsulates the characteristics of magnetic storage media (Tapes, Fixed HDDs, and Portable HDDs) in IGCSE ICT Chapter 3?",
                options: [
                    { text: "Magnetic media use magnetic polarization on iron oxide coatings to provide high-capacity, low-cost non-volatile storage, utilizing either serial access (tapes) or direct access (HDDs)", isCorrect: true, rationale: "Magnetic storage provides economical, massive capacity using magnetism, with tapes using serial access and disks using direct access." },
                    { text: "Magnetic media rely on semiconductor NAND flash chips with zero moving parts", isCorrect: false, rationale: "This describes solid-state media, not magnetic storage." },
                    { text: "Magnetic media use laser beams to read microscopic polycarbonate pits and lands", isCorrect: false, rationale: "This describes optical storage." },
                    { text: "Magnetic media are volatile primary memory chips that lose data when powered down", isCorrect: false, rationale: "Magnetic storage is non-volatile backing storage." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const questionBox = document.getElementById("question-box");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultsContainer = document.getElementById("results-container");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");
            
            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionBox.textContent = q.question;

            // Shuffle options array randomly so correct answer is not always first
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = "";
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(opt, shuffledOptions);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, shuffledOptions) {
            if (answered) return;
            answered = true;

            const allOptionButtons = optionsContainer.children;

            shuffledOptions.forEach((opt, idx) => {
                allOptionButtons[idx].disabled = true;
                if (opt.isCorrect) {
                    allOptionButtons[idx].classList.add("correct");
                } else if (opt === selectedOpt && !selectedOpt.isCorrect) {
                    allOptionButtons[idx].classList.add("incorrect");
                }
            });

            feedbackBox.classList.remove("hidden");
            if (selectedOpt.isCorrect) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                feedbackBox.className = "feedback-box correct-feedback";
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOpt.rationale}`;
            } else {
                feedbackBox.className = "feedback-box incorrect-feedback";
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOpt.rationale}`;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = "Next Question";
            } else {
                nextBtn.textContent = "View Results";
            }
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                quizContainer.classList.add("hidden");
                resultsContainer.classList.remove("hidden");
                finalScore.textContent = `You scored ${score} out of ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultsContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
</body>
</html>
